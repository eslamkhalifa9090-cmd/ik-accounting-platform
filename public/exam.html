<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الامتحان | Mr. Islam Khalifa</title>
<link rel="icon" href="/assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js"></script>
</head>
<body>
<main class="wrap narrow">
  <div id="root"><div class="loading">جاري التحميل...</div></div>
</main>
<script>
(async function () {
  const me = await IK.requireUser();
  await IK.chrome({ user: me });
  const root = IK.$("#root");
  const id = IK.qs("id");
  let info;
  try { info = await IK.api("/student/exams/" + encodeURIComponent(id)); }
  catch (e) { root.innerHTML = `<div class="card empty" style="margin-top:28px">${IK.esc(e.message)}</div>`; return; }
  const e = info.exam;
  document.title = e.title + " | " + info.course.title;
  const back = `/level?id=${info.level.id}`;
  const U = IK.U(info.course.unit);

  function intro() {
    root.innerHTML = `
      <div class="page-head"><a class="muted" href="${back}">← ${U.the} ${info.level.num}: ${IK.esc(info.level.title)}</a>
        <h1>${IK.esc(e.title)}</h1></div>
      <div class="card stack">
        <p>الامتحان فيه <b>${e.questions}</b> سؤال اختيار من متعدد، والنجاح بأكتر من <b>${e.pass_pct}%</b>.</p>
        ${e.duration_min ? `<p>متوسط حل الامتحان <b>${e.duration_min} دقيقة</b>. هيظهرلك عداد تنازلي، ولما الوقت يخلص الامتحان بيتسلم لوحده باللي حليته.</p>` : ""}
        <p>المحاولات مفتوحة، وكل محاولة بتجيبلك أسئلة ماشفتهاش قبل كده لحد ما بنك الأسئلة يخلص. اقرا كل سؤال كويس قبل ما تختار.</p>
        ${e.tries ? `<p class="muted">حاولت قبل كده ${e.tries} مرة، وأعلى درجة ليك ${e.best}%.</p>` : ""}
        <div><button class="btn btn-primary" id="start" type="button">ابدأ الامتحان</button></div>
      </div>`;
    IK.$("#start").onclick = start;
  }

  async function start() {
    root.innerHTML = '<div class="loading">جاري تجهيز الأسئلة...</div>';
    let a;
    try { a = await IK.api(`/student/exams/${id}/start`, { method: "POST" }); }
    catch (err) { root.innerHTML = `<div class="card empty">${IK.esc(err.message)}</div>`; return; }
    root.innerHTML = `
      <div class="page-head"><h1>${IK.esc(e.title)}</h1><p class="muted">جاوب على كل الأسئلة وبعدين اضغط "سلّم الامتحان".</p></div>
      ${a.duration_min ? '<div class="timer" id="timer"><span>الوقت الباقي</span><b id="clock"></b></div>' : ""}
      <form id="f">${a.questions.map((q) => `
        <fieldset class="q" style="margin:0 0 12px">
          <h3>${q.n}. ${IK.esc(q.body)}</h3>
          ${q.options.map((o, i) => `<label><input type="radio" name="q${q.id}" value="${i}"><span>${IK.esc(o)}</span></label>`).join("")}
        </fieldset>`).join("")}
        <div class="status" id="st" hidden></div>
        <div class="spread" style="margin-top:16px"><span class="muted" id="left"></span><button class="btn btn-primary" id="send" type="submit">سلّم الامتحان</button></div>
      </form>`;
    const f = IK.$("#f"), left = IK.$("#left");
    const count = () => a.questions.filter((q) => f.querySelector(`input[name="q${q.id}"]:checked`)).length;
    const upd = () => { left.textContent = `جاوبت ${count()} من ${a.questions.length}`; };
    f.addEventListener("change", upd); upd();
    window.onbeforeunload = () => true;
    let tick = null, sent = false;
    async function send(auto) {
      if (sent) return;
      const answers = {};
      for (const q of a.questions) { const c = f.querySelector(`input[name="q${q.id}"]:checked`); if (c) answers[q.id] = Number(c.value); }
      sent = true;
      IK.$("#send").disabled = true;
      try {
        const r = await IK.api(`/student/attempts/${a.attempt}/submit`, { method: "POST", body: { answers } });
        clearInterval(tick);
        window.onbeforeunload = null;
        result(r, auto);
      } catch (err) { sent = false; IK.status(IK.$("#st"), "bad", err.message); IK.$("#send").disabled = false; }
    }
    if (a.duration_min) {
      // العداد بيتحسب من وقت البداية الفعلي، فلو التاب اتقفل أو النت وقف الوقت مش بيقف
      const end = Date.now() + a.duration_min * 60000;
      const clock = IK.$("#clock"), box = IK.$("#timer");
      const draw = () => {
        const left = Math.max(0, Math.round((end - Date.now()) / 1000));
        clock.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
        box.classList.toggle("warn", left <= 60);
        if (!left) { clearInterval(tick); send(true); }
      };
      draw();
      tick = setInterval(draw, 1000);
    }
    f.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      if (count() < a.questions.length && !confirm("لسه فيه أسئلة ما جاوبتش عليها. تسلم كده؟")) return;
      send(false);
    });
  }

  function result(r, auto) {
    const wrong = r.review.filter((q) => q.chosen !== q.correct).length;
    root.innerHTML = `
      <div class="page-head"><h1>${r.passed ? "مبروك، عديت الامتحان" : "قربت.. حاول تاني"}</h1>
        ${auto ? '<p class="muted">الوقت خلص، والامتحان اتسلم لوحده باللي حليته.</p>' : ""}
        ${r.late ? '<p class="status bad">الامتحان اتسلم بعد الوقت المسموح، فالإجابات ما اتحسبتش.</p>' : ""}</div>
      <div class="card stack" style="text-align:center">
        <p style="font-family:var(--f-display);font-size:48px;color:${r.passed ? "var(--ok)" : "var(--bad)"}" class="num">${r.score}%</p>
        <p>جاوبت صح على <b>${r.correct}</b> من <b>${r.total}</b> سؤال. النجاح بأكتر من ${r.pass_pct}%.</p>
        <p class="muted">${r.passed ? "المرحلة الجاية اتفتحتلك. وتقدر تتمرن بأسئلة جديدة وقت ما تحب." : "راجع أخطاءك تحت، وارجع للمادة العلمية، وادخل تاني. الأسئلة هتتغير."}</p>
        <div class="row" style="justify-content:center">
          <a class="btn btn-primary" href="${back}">ارجع ${U.li}</a>
          <button class="btn btn-ghost" id="again" type="button">امتحان جديد بأسئلة مختلفة</button>
          <a class="btn btn-ghost" href="/dashboard">جدول امتحاناتي</a>
        </div>
      </div>
      <h2 style="font-size:19px;margin:24px 0 10px">مراجعة إجاباتك ${wrong ? `<span class="badge bad">${wrong} غلط</span>` : '<span class="badge ok">كله صح</span>'}</h2>
      <div>${r.review.map((q) => {
        const ok = q.chosen === q.correct;
        return `<div class="rv${ok ? "" : " wrong"}"><h3>${q.n}. ${IK.esc(q.body)} ${ok ? '<span class="badge ok">صح</span>' : q.chosen === null ? '<span class="badge lock">ما جاوبتش</span>' : '<span class="badge bad">غلط</span>'}</h3>
          <ol>${q.options.map((o, i) => `<li class="${i === q.correct ? "right" : i === q.chosen ? "picked" : ""}">${IK.esc(o)}${i === q.correct ? " ✓" : ""}</li>`).join("")}</ol>
          ${!ok && q.explanation ? `<div class="why"><b>التوضيح:</b> ${IK.esc(q.explanation)}</div>` : ""}</div>`;
      }).join("")}</div>`;
    IK.$("#again").onclick = start;
    scrollTo({ top: 0, behavior: "smooth" });
  }

  intro();
})();
</script>
</body>
</html>
