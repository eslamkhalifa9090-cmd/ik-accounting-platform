<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المتدرب | Mr. Islam Khalifa</title>
<link rel="icon" href="/assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js"></script>
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <span class="eyebrow">لوحة المتدرب</span>
    <h1 id="hello">أهلاً بيك</h1>
    <p>هنا هتلاقي كورساتك ونسبة تقدمك في كل كورس، وتكمل من المكان اللي وقفت عنده.</p>
  </div>
  <div id="mine" class="stack"><div class="loading">جاري التحميل...</div></div>
  <section style="margin-top:36px">
    <h2 style="font-size:20px;margin-bottom:12px">مسارات تانية في المنصة</h2>
    <div id="others" class="grid grid-3"></div>
  </section>
</main>
<script>
(async function () {
  const me = await IK.requireUser();
  const site = await IK.chrome({ user: me });
  const s = site.settings;
  IK.$("#hello").textContent = "أهلاً بيك يا " + me.name.split(" ")[0];
  const d = await IK.api("/student/dashboard");
  const mine = IK.$("#mine");
  const care = IK.wa(IK.contact(s, "customer"), "السلام عليكم، أنا " + me.name + " ومحتاج أسأل عن اشتراكي في المنصة.");
  const statusBadge = {
    passed: '<span class="badge ok">ناجح</span>', failed: '<span class="badge bad">محتاج تعيده</span>', ready: '<span class="badge gold">متاح دلوقتي</span>',
    materials: '<span class="badge lock">بعد ما تخلص المادة</span>', locked: '<span class="badge lock">مقفول</span>', not_ready: '<span class="badge lock">الأسئلة بتتجهز</span>',
  };
  const nextHref = (c) => {
    const n = c.next;
    if (!n) return "/learn?c=" + encodeURIComponent(c.slug);
    if (n.type === "certificate") return "/certificate?c=" + encodeURIComponent(c.slug);
    if (n.type === "exam") return "/exam?id=" + n.exam_id;
    if (n.type === "material") return "/level?id=" + n.level_id + "&m=" + n.material_id;
    return "/level?id=" + n.level_id;
  };
  const pct = (v) => (v === null || v === undefined ? "—" : v + "%");
  const examsTable = (c) => `
    <div class="table-wrap"><table class="t"><thead><tr><th>#</th><th>الامتحان</th><th>حليته؟</th><th>أول درجة</th><th>أعلى درجة</th><th>المحاولات</th><th>الحالة</th><th></th></tr></thead><tbody>
    ${c.exams.map((e) => `<tr>
      <td class="num">${e.n}</td>
      <td>${IK.esc(e.title)}${e.kind === "cumulative" ? ' <span class="badge gold">تراكمي</span>' : ""}</td>
      <td>${e.tries ? "✓ أيوه" : "لسه"}</td>
      <td class="num">${pct(e.first)}</td><td class="num"><b>${pct(e.best)}</b></td><td class="num">${e.tries}</td>
      <td>${statusBadge[e.status] || ""}</td>
      <td>${c.active && ["ready", "failed", "passed"].includes(e.status) ? `<a class="btn btn-ghost btn-sm" href="/exam?id=${e.id}">${e.status === "passed" ? "اتمرن تاني" : "ادخل"}</a>` : ""}</td>
    </tr>`).join("")}
    </tbody></table></div>`;
  if (!d.courses.length) {
    mine.innerHTML = `<div class="card empty">لسه مفيش كورسات متفعلة على حسابك. لو دفعت الاشتراك، <a href="${care}" target="_blank" rel="noopener">كلم خدمة العملاء</a> علشان يفعلوه.</div>`;
  } else {
    mine.innerHTML = d.courses.map((c) => `
      <article class="card stack">
        <div class="spread"><h2>${IK.esc(c.title)}</h2><span class="badge ${c.plan === "pro" ? "gold" : ""}">${c.plan === "pro" ? "باقة Pro" : "الباقة الأساسية"}</span></div>
        <div><div class="spread"><span>نسبة التقدم في الكورس</span><b class="num">${c.progress}%</b></div><div class="bar"><i style="width:${c.progress}%"></i></div></div>
        <div class="stats-row">
          <div><b class="num">${c.current_level}<small> / ${c.levels}</small></b><span>${IK.U(c.unit).the} الحالي${IK.U(c.unit).key === "unit" ? "ة" : ""}</span></div>
          <div><b class="num">${c.summary.passed}<small> / ${c.summary.total}</small></b><span>امتحانات عديتها</span></div>
          <div><b class="num">${c.summary.avg_best === null ? "—" : c.summary.avg_best + "%"}</b><span>متوسط أعلى درجاتك</span></div>
        </div>
        ${c.active ? "" : `<div class="status bad">اشتراكك انتهى. <a href="${care}" target="_blank" rel="noopener">كلم خدمة العملاء</a> علشان تجدده.</div>`}
        ${c.expires_at && c.active ? '<p class="muted">الاشتراك متاح لحد ' + IK.esc(c.expires_at) + "</p>" : ""}
        ${c.active && c.next ? `<div class="next-step"><span class="muted">الخطوة الجاية</span><b>${IK.esc(c.next.label)}</b>
          <div class="row"><a class="btn ${c.next.type === "certificate" ? "btn-gold" : "btn-primary"}" href="${nextHref(c)}">${c.next.type === "certificate" ? "استلم شهادتك" : c.progress ? "كمل من حيث وقفت" : "ابدأ الكورس"}</a>
          <a class="btn btn-ghost" href="/learn?c=${encodeURIComponent(c.slug)}">خريطة ${IK.U(c.unit).pl}</a></div></div>` : ""}
        <h3 style="margin-top:6px">امتحاناتك</h3>
        ${examsTable(c)}
      </article>`).join("");
  }
  const enrolled = new Set(d.courses.map((c) => c.slug));
  IK.$("#others").innerHTML = site.courses.filter((c) => !enrolled.has(c.slug)).map((c) => `
    <article class="card stack">
      <div class="spread"><h3>${IK.esc(c.title)}</h3>${c.status === "soon" ? '<span class="badge lock">قيد الافتتاح قريباً</span>' : '<span class="badge ok">متاح</span>'}</div>
      <p class="muted">${IK.esc(c.subtitle || "")}</p>
      ${c.status === "open"
        ? `<a class="btn btn-ghost" href="/course?c=${encodeURIComponent(c.slug)}">تفاصيل الكورس</a>`
        : `<a class="btn btn-ghost" target="_blank" rel="noopener" href="${IK.wa(s.whatsapp, IK.fill(s.notify_message, { course: c.title }))}">${IK.chatIcon}بلغني أول ما يفتح</a>`}
    </article>`).join("") || '<p class="muted">إنت مشترك في كل المسارات المتاحة.</p>';
})();
</script>
</body>
</html>
