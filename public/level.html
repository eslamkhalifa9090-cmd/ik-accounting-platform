<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IK Academy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js"></script>
<script src="/assets/viewer.js"></script>
</head>
<body>
<style>@media print{body *{visibility:hidden!important}}</style>
<main class="wrap">
  <div id="root"><div class="loading">جاري التحميل...</div></div>
</main>
<script>
(async function () {
  const me = await IK.requireUser();
  const site = await IK.chrome({ user: me });
  const s = site.settings;
  const root = IK.$("#root");
  let d;
  try { d = await IK.api("/student/level/" + encodeURIComponent(IK.qs("id"))); }
  catch (e) { root.innerHTML = `<div class="card empty" style="margin-top:28px">${IK.esc(e.message)}</div>`; return; }
  const l = d.level, c = d.course, U = IK.U(c.unit);
  document.title = U.the + " " + l.num + " | " + c.title;
  const follow = IK.wa(IK.contact(s, "lecturer"), IK.fill(s.follow_message, { name: me.name, course: c.title, level: U.the + " " + l.num + " (" + l.title + ")" }));
  const upgrade = IK.wa(IK.contact(s, "customer"), "السلام عليكم، عايز أرفع باقتي في كورس " + c.title + " لباقة Pro.");
  const examCard = (e) => {
    if (!e) return "";
    const state = e.passed ? `<span class="badge ok">عديته · أعلى درجة ${e.best}%</span>`
      : e.tries ? `<span class="badge bad">${e.tries} محاولة · أعلى درجة ${e.best}%</span>` : "";
    const action = !e.ready ? '<span class="badge lock">الأسئلة لسه بتتجهز</span>'
      : !e.available ? `<span class="badge lock">${e.waiting === "materials" ? "هيفتح بعد ما تخلص الفصول" : "هيفتح بعد امتحان " + U.the + " " + U.before}</span>`
      : `<a class="btn ${e.passed ? "btn-ghost" : "btn-primary"}" href="/exam?id=${e.id}">${e.passed ? "حسّن درجتك" : e.tries ? "حاول تاني" : "ادخل الامتحان"}</a>`;
    return `<article class="card spread"><div><h3>${IK.esc(e.title)}</h3><p class="muted">${e.ready ? e.questions + " سؤال · النجاح من " + e.pass_pct + "% أو أكتر" + (e.duration_min ? " · متوسط الحل " + e.duration_min + " دقيقة" : "") : ""}</p><div class="row" style="margin-top:6px">${state}</div></div>${action}</article>`;
  };
  root.innerHTML = `
    <div class="page-head">
      <a class="muted" href="/learn?c=${encodeURIComponent(c.slug)}">← ${IK.esc(c.title)}</a>
      <h1>${U.the} ${l.num}: ${IK.esc(l.title)}</h1>
      ${l.topics ? `<p><b>محتوى ${U.the}:</b> ${IK.esc(l.topics)}</p>` : ""}
      ${l.teaser ? `<p style="margin-top:10px">${IK.esc(l.teaser)}</p>` : ""}
    </div>
    <h2 style="font-size:19px;margin-bottom:10px">فصول ${U.the}</h2>
    <div class="stack" id="mats">${l.materials.length ? l.materials.map((m, i) => `
      <article class="card spread chapter${m.done ? " is-done" : ""}${m.allowed && !m.open ? " is-locked" : ""}">
        <div class="row" style="gap:12px;flex-wrap:nowrap;align-items:flex-start"><span class="ch-num num">${m.done ? "✓" : i + 1}</span>
          <div><h3>${IK.esc(m.title)}</h3>
          <p class="muted">${m.kind === "pdf" ? (m.pages ? m.pages + " صفحة" : "لسه بيتجهز") : "🎬 فيديو"}${m.done ? " · خلصته" : ""}</p></div></div>
        ${!m.allowed ? `<a class="btn btn-gold" target="_blank" rel="noopener" href="${upgrade}">متاح في باقة Pro</a>`
          : m.kind === "pdf" && !m.pages ? ""
          : !m.open ? '<span class="badge lock">🔒 بيفتح بعد اللي قبله</span>'
          : `<button class="btn ${m.done ? "btn-ghost" : "btn-primary"} js-open" data-id="${m.id}" type="button">${m.done ? "راجعه" : "افتح"}</button>`}
      </article>`).join("") : `<div class="card empty">فصول ${U.this} بتتجهز وهتنزل قريب.</div>`}</div>
    ${l.materials.length ? '<p class="muted" style="margin-top:8px">الفصول بتفتح بالترتيب: افتح الفصل لحد آخر صفحة واضغط "خلصت المادة دي" علشان اللي بعده يفتح.' + (l.exam && !l.materials_done ? " وامتحان " + U.the + " " + U.opens + " لما تخلص الفصول كلها." : "") + "</p>" : ""}
    <p class="muted" style="margin-top:8px">الملف مش بيفتح أو فيه مشكلة؟ <a target="_blank" rel="noopener" href="${IK.supportLink(s, me.name)}">كلم الدعم الفني</a></p>
    <section id="viewer-wrap" style="margin-top:20px" hidden></section>
    <h2 style="font-size:19px;margin:28px 0 10px">الامتحانات</h2>
    <div class="stack">${examCard(l.exam)}${examCard(l.cumulative)}</div>
    <div class="row" style="margin-top:24px"><a class="btn btn-wa" target="_blank" rel="noopener" href="${follow}">${IK.chatIcon}عندك سؤال؟ كلم المحاضر</a></div>`;

  // ===== عارض المادة المحمي =====
  const wrap = IK.$("#viewer-wrap");
  wrap.addEventListener("contextmenu", (e) => e.preventDefault());
  wrap.addEventListener("dragstart", (e) => e.preventDefault());

  const openPdf = (m) => IK.openPdf(wrap, m, {
    s, who: me,
    src: (n) => `/api/student/materials/${m.id}/pages/${n}?v=${m.version}`,
    onPage: (p) => IK.api(`/student/materials/${m.id}/position`, { method: "PUT", body: { page: p } }).catch(() => {}),
    onDone: async () => { await IK.api(`/student/materials/${m.id}/done`, { method: "POST" }); location.reload(); },
  });

  function embedUrl(u) {
    try {
      const url = new URL(u);
      if (/youtube\.com$/.test(url.hostname.replace(/^www\./, "")) && url.searchParams.get("v")) return "https://www.youtube-nocookie.com/embed/" + url.searchParams.get("v");
      if (url.hostname === "youtu.be") return "https://www.youtube-nocookie.com/embed" + url.pathname;
      return u;
    } catch (e) { return ""; }
  }
  function openVideo(m) {
    wrap.hidden = false;
    const src = embedUrl(m.video_url || "");
    wrap.innerHTML = `<div class="spread" style="margin-bottom:10px"><h2 style="font-size:19px">${IK.esc(m.title)}</h2><button class="btn btn-ghost btn-sm" id="v-close" type="button">قفل</button></div>
      ${src ? `<div style="position:relative;padding-top:56.25%;border-radius:var(--r-l);overflow:hidden;background:#000"><iframe src="${IK.esc(src)}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>` : '<div class="card empty">الفيديو لسه ما اتضافش.</div>'}
      <div class="row" style="margin-top:12px"><button class="btn btn-gold" id="v-done" type="button">خلصت الفيديو ده ✓</button></div>`;
    IK.$("#v-close").onclick = () => { wrap.hidden = true; wrap.innerHTML = ""; };
    IK.$("#v-done").onclick = async () => { await IK.api(`/student/materials/${m.id}/done`, { method: "POST" }); location.reload(); };
    wrap.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  async function openMaterial(id) {
    const m = await IK.api("/student/materials/" + id);
    if (m.kind === "pdf") await openPdf(m); else openVideo(m);
  }
  root.addEventListener("click", async (ev) => {
    const b = ev.target.closest(".js-open");
    if (!b) return;
    b.disabled = true;
    try { await openMaterial(b.dataset.id); } catch (e) { alert(e.message); }
    b.disabled = false;
  });
  // جاي من "كمل من حيث وقفت": افتح الملف على طول
  const auto = IK.qs("m");
  if (auto && l.materials.some((x) => String(x.id) === auto && x.allowed && x.open)) openMaterial(auto).catch(() => {});
})();
</script>
</body>
</html>
